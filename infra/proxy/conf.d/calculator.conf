server {
    listen 443 ssl;
    http2 on;
    server_name calculator.masings.com;

    ssl_certificate     /etc/letsencrypt/live/masings-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masings-apps/privkey.pem;

    # Docker's DNS: Nginx still starts even if this app is stopped
    resolver 127.0.0.11 valid=10s;
    set $calc http://masings-calculator:3000;

    # Shared by both locations below
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Everything else -> client
    location / {
        proxy_pass $calc;
    }
}
