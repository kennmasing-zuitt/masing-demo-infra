# dossier.masings.com -> dossier container (self-hosted job search and resume builder)
#
# Port 80 / HTTP->HTTPS is handled by the proxy's shared 00-http.conf.

server {
    listen 443 ssl;
    http2 on;
    server_name dossier.masings.com;

    # Shared certificate: it must list dossier.masings.com (or be a wildcard)
    ssl_certificate     /etc/letsencrypt/live/masings-apps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masings-apps/privkey.pem;

    # Docker's DNS: Nginx still starts even if this app is stopped
    resolver 127.0.0.11 valid=10s;
    set $dossier http://dossier:3000;

    # Resume uploads and data imports: the app accepts up to 10 MB
    client_max_body_size 12m;

    location / {
        proxy_pass $dossier;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # the app sets Secure cookies when this is https

        # AI jobs report progress as a server-sent event stream (/api/jobs/<id>/events)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
